<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByeFrame v7.7 - Black Hole</title>
    <style>
        body { 
            margin: 0; background: black; color: white; 
            font-family: 'Helvetica', 'Arial', sans-serif; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh;
        }
        
        #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px; }
        
        /* MİKRO ODAK: Zırhlı Harf Yapısı */
        #odak { 
            font-size: 11.5px; 
            font-weight: 800; /* Ekstra kalın, inceltme payı için */
            line-height: 1.8;
            text-align: center;
            max-width: 270px;
            color: #fff;
            /* Donanım seviyesinde kenar yumuşatmayı (blur) kapat */
            -webkit-font-smoothing: none;
            text-rendering: crispEdges;
        }

        .controls { background: #080808; padding: 25px; border-top: 1px solid #333; }
        .row { margin-bottom: 20px; }
        .label-wrap { display: flex; justify-content: space-between; margin-bottom: 5px; }
        label { color: #007bff; font-size: 10px; font-weight: bold; }
        span { font-size: 10px; color: #fff; background: #222; padding: 2px 6px; border-radius: 4px; }
        input { width: 100%; height: 35px; accent-color: #007bff; }
    </style>
</head>
<body>

    <div id="stage">
        <div id="odak">
            ByeFrame v7.7 Son Atış:<br>
            Şu an harflerin arkasında "Siyah Delik" zırhı var. 
            0.7 Anti-Halo ile harfi inceltirken, Gölge Gücü ile harfin etrafındaki beyaz sızmayı (bleed) içeri hapsediyoruz. 
            Bu boyutta netlik yakalarsak, Frankfurt sunucusu bile şapka çıkarır!
        </div>
    </div>

    <div class="controls">
        <div class="row">
            <div class="label-wrap"><label>1. GÖLGE ZIRHI (BLACK HOLE)</label><span id="v2">0.3</span></div>
            <input type="range" id="s2" min="0" max="2" step="0.1" value="0.3" oninput="run()">
        </div>
        
        <div class="row">
            <div class="label-wrap"><label>2. ANTI-HALO (İNCELTME)</label><span id="v1">0.7</span></div>
            <input type="range" id="s1" min="0" max="1.5" step="0.05" value="0.7" oninput="run()">
        </div>

        <div class="row">
            <div class="label-wrap"><label>3. HARF ARALIĞI</label><span id="v3">2</span></div>
            <input type="range" id="s3" min="0" max="8" value="2" oninput="run()">
        </div>
    </div>

    <script>
        function run() {
            var armor = document.getElementById('s2').value;
            var thin = document.getElementById('s1').value;
            var space = document.getElementById('s3').value;
            var el = document.getElementById('odak');

            // 1. Shadow Armor: Harfin etrafına keskin siyah bir koruma kalkanı
            // Bulanıklığı emmek için blur değeri 0 tutulur.
            el.style.textShadow = `0 0 ${armor}px #000, 0 0 ${armor}px #000, 0 0 ${armor}px #000`;

            // 2. Anti-Halo (Stroke)
            el.style.webkitTextStroke = thin + "px black"; 

            // 3. Aralığı Uygula
            el.style.letterSpacing = space + "px";

            // Değerleri Yaz
            document.getElementById('v1').innerText = thin;
            document.getElementById('v2').innerText = armor;
            document.getElementById('v3').innerText = space;
        }
        window.onload = run;
    </script>
</body>
</html>

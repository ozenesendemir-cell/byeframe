<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByeFrame v7.8 - Image Support</title>
    <style>
        body { 
            margin: 0; background: black; color: white; 
            font-family: sans-serif; overflow-x: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }
        #stage { flex: 1; overflow-y: auto; padding: 20px; text-align: center; }
        
        /* FİLTRE BURAYA UYGULANIR (Tüm İçeriğe) */
        #content-wrapper { filter: url(#globalOptic); }

        .test-img { width: 100%; max-width: 250px; border-radius: 10px; margin-top: 15px; }
        
        #odak { font-size: 14px; font-weight: 700; margin-bottom: 20px; }

        .controls { background: #0a0a0a; padding: 20px; border-top: 1px solid #333; }
        .row { margin-bottom: 15px; }
        label { display: block; color: #007bff; font-size: 11px; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; height: 35px; accent-color: #007bff; }
    </style>
</head>
<body>

    <div id="stage">
        <div id="content-wrapper">
            <div id="odak">
                GÖRÜNTÜ TEST MODU v7.8<br>
                <small>Metin ve görsel aynı anda işleniyor.</small>
            </div>
            
            <img src="https://picsum.photos/400/300?grayscale" class="test-img" id="img-target">
            
            <p style="font-size: 10px; margin-top: 15px; opacity: 0.8;">
                Görüntüdeki detaylar (ağaç dalları, bina çizgileri) keskinleşiyor mu?
            </p>
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="globalOptic">
            <feConvolveMatrix id="mx" order="3" preserveAlpha="true" kernelMatrix="0 0 0 0 1 0 0 0 0" />
            <feComponentTransfer id="ct">
                <feFuncR type="linear" slope="1" intercept="0"/>
                <feFuncG type="linear" slope="1" intercept="0"/>
                <feFuncB type="linear" slope="1" intercept="0"/>
            </feComponentTransfer>
        </filter>
    </svg>

    <div class="controls">
        <div class="row">
            <label>1. GLOBAL KESKİNLİK (DE-CONV): <span id="v1">0</span></label>
            <input type="range" id="s1" min="0" max="400" value="0" oninput="apply()">
        </div>
        <div class="row">
            <label>2. GÖRÜNTÜ KONTRASTI: <span id="v2">1.0</span></label>
            <input type="range" id="s2" min="1" max="3" step="0.1" value="1" oninput="apply()">
        </div>
    </div>

    <script>
        function apply() {
            var sharp = document.getElementById('s1').value;
            var contrast = document.getElementById('s2').value;

            // 1. Matris Güncelleme
            var edge = -(sharp / 25).toFixed(2);
            var center = (1 - (edge * 4)).toFixed(2);
            document.getElementById('mx').setAttribute('kernelMatrix', `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`);

            // 2. Kontrast Güncelleme
            var funcs = document.querySelectorAll('#ct feFuncR, #ct feFuncG, #ct feFuncB');
            funcs.forEach(f => f.setAttribute('slope', contrast));

            document.getElementById('v1').innerText = sharp;
            document.getElementById('v2').innerText = contrast;
        }
    </script>
</body>
</html>

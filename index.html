<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ByeFrame · Gözlüğe Veda</title>
  <link rel="manifest" href="data:application/manifest+json,{"name":"ByeFrame","short_name":"ByeFrame","start_url":".","display":"standalone","theme_color":"#0a0f1e","background_color":"#0a0f1e"}">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container" id="appContainer">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">👁️</span> 
        <span class="logo-text">ByeFrame</span>
      </div>
      <div class="header-controls">
        <div class="profile-selector">
          <label for="profileSelect">Profil:</label>
          <select id="profileSelect" class="profile-dropdown"></select>
        </div>
        <button id="panicResetBtn" class="panic-button">⏻ Reset</button>
      </div>
    </header>

    <main class="viewport-area">
      <div class="optical-canvas" id="opticalCanvas">
        <div class="test-card">
          <h1>✨ ByeFrame · Net Görüş</h1>
          <p class="subhead">Miyop, astigmat ve odaklanma sorunları için dijital mercek.</p>
          
          <div class="grid-demo">
            <div class="demo-box text-heavy">
              <h2>📖 Okuma Testi</h2>
              <p>Bu metni gözlüksüz okumaya çalışın. Alttaki sürgülerle netliği yakaladığınızda profiliniz kaydedilecektir.</p>
              <div class="letter-chart">E F P T O Z L P E D</div>
            </div>
            <div class="demo-box vision-grid">
              <h3>🔴 Renk ve Kontrast</h3>
              <div class="gradient-strip"></div>
              <div class="chromatic-demo">RGB TEST</div>
            </div>
          </div>
          
          <div class="control-panel">
            <h3>🎛️ Optik İnce Ayar</h3>
            <div class="slider-group">
              <label>🔆 Kontrast: <span id="contrastVal">100</span>%</label>
              <input type="range" id="contrastSlider" min="50" max="200" step="1" value="100">
            </div>
            <div class="slider-group">
              <label>✨ Keskinlik: <span id="sharpVal">0</span></label>
              <input type="range" id="sharpSlider" min="-6" max="6" step="0.5" value="0">
            </div>
            <div class="slider-group">
              <label>🌈 Renk Kayması (Astigmat): <span id="chromaVal">0</span></label>
              <input type="range" id="chromaSlider" min="0" max="8" step="0.2" value="0">
            </div>
            <div class="slider-group">
              <label>💡 Parlaklık: <span id="brightVal">100</span>%</label>
              <input type="range" id="brightSlider" min="60" max="160" step="1" value="100">
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>

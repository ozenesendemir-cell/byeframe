<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByeFrame v8.1 - Ultra Fix</title>
    <style>
        body { 
            margin: 0; background: black; color: white; 
            font-family: sans-serif; display: flex; flex-direction: column; 
            height: 100vh; width: 100vw; overflow: hidden;
        }

        /* Görsel Alanı: Ekranın üst yarısı */
        #display-stage { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; padding: 10px;
        }

        #viewport { filter: url(#byeEngine); text-align: center; }
        .test-img { width: 100%; max-width: 240px; height: auto; border-radius: 8px; margin: 5px 0; }
        #odak { font-size: 12px; font-weight: 700; margin-bottom: 5px; }

        /* Kontrol Alanı: Ekranın alt yarısı - KAÇAMAZ */
        .controls { 
            height: 45vh; background: #111; padding: 15px; 
            border-top: 2px solid #007bff; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: space-around;
        }

        .row { width: 100%; }
        .l-wrap { display: flex; justify-content: space-between; margin-bottom: 2px; }
        label { color: #007bff; font-size: 10px; font-weight: bold; }
        span { font-size: 10px; background: #222; padding: 2px 5px; border-radius: 3px; }
        
        input[type=range] { 
            width: 100%; height: 40px; /* Dokunma alanı büyütüldü */
            accent-color: #007bff;
        }
    </style>
</head>
<body>

    <div id="display-stage">
        <div id="viewport">
            <div id="odak">v8.1 KESKİN ODAK TESTİ</div>
            <img src="https://images.unsplash.com/photo-1509048191080-d2984bad6ae5?auto=format&fit=crop&w=400&q=80" class="test-img">
            <p style="font-size: 10px; color: #888; margin:0;">Dişli ve rakam netliğini kontrol et.</p>
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="byeEngine" color-interpolation-filters="sRGB">
            <feConvolveMatrix id="mx" order="3" preserveAlpha="true" kernelMatrix="0 0 0 0 1 0 0 0 0" />
            <feComponentTransfer id="ct">
                <feFuncR type="linear" slope="3" />
                <feFuncG type="linear" slope="3" />
                <feFuncB type="linear" slope="3" />
            </feComponentTransfer>
        </filter>
    </svg>

    <div class="controls">
        <div class="row">
            <div class="l-wrap"><label>KESKİNLİK</label><span id="v1">175</span></div>
            <input type="range" id="s1" min="0" max="400" value="175" oninput="up()">
        </div>
        <div class="row">
            <div class="l-wrap"><label>KONTRAST</label><span id="v2">3</span></div>
            <input type="range" id="s2" min="1" max="5" step="0.1" value="3" oninput="up()">
        </div>
        <div class="row">
            <div class="l-wrap"><label>ANTI-HALO</label><span id="v3">0.7</span></div>
            <input type="range" id="s3" min="0" max="1.5" step="0.05" value="0.7" oninput="up()">
        </div>
    </div>

    <script>
        function up() {
            var s = document.getElementById('s1').value;
            var c = document.getElementById('s2').value;
            var h = document.getElementById('s3').value;

            var edge = -(s / 25).toFixed(2);
            var center = (1 - (edge * 4)).toFixed(2);
            document.getElementById('mx').setAttribute('kernelMatrix', `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`);

            var funcs = document.querySelectorAll('#ct feFuncR, #ct feFuncG, #ct feFuncB');
            funcs.forEach(f => f.setAttribute('slope', c));

            document.getElementById('odak').style.webkitTextStroke = h + "px black";
            document.getElementById('v1').innerText = s;
            document.getElementById('v2').innerText = c;
            document.getElementById('v3').innerText = h;
        }
        window.onload = up;
    </script>
</body>
</html>

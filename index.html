<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByeFrame v7.3 - Sharp Focus</title>
    <style>
        body { 
            margin: 0; background: black; color: white; 
            font-family: sans-serif; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh;
        }
        
        #stage { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            padding: 20px;
        }
        
        /* OKUMA ALANI: Büyütmek yerine keskinleştirmeye odaklı */
        #odak { 
            font-size: 24px; /* Başlangıç boyutu makul */
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
            filter: url(#motor);
            will-change: letter-spacing, -webkit-text-stroke;
        }

        .controls { background: #0a0a0a; padding: 20px; border-top: 1px solid #333; }
        .row { margin-bottom: 15px; }
        .label-wrap { display: flex; justify-content: space-between; margin-bottom: 5px; }
        label { color: #007bff; font-size: 11px; font-weight: bold; text-transform: uppercase; }
        span { font-size: 11px; color: #555; }
        input { width: 100%; height: 35px; accent-color: #007bff; }
    </style>
</head>
<body>

    <div id="stage">
        <div id="odak">
            ByeFrame Operasyonu v7.3<br>
            Büyütme değil, odaklanma.<br>
            +2.5 Presbiopi Test Metni.
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="motor" color-interpolation-filters="sRGB">
            <feConvolveMatrix id="mx" order="3" preserveAlpha="true" kernelMatrix="0 0 0 0 1 0 0 0 0" />
        </filter>
    </svg>

    <div class="controls">
        <div class="row">
            <div class="label-wrap"><label>1. KESKİNLİK (KAYAÇ)</label><span id="v2">0</span></div>
            <input type="range" id="s2" min="0" max="400" value="0" oninput="run()">
        </div>
        
        <div class="row">
            <div class="label-wrap"><label>2. HARF İNCELTME (ANTI-HALO)</label><span id="v1">0</span></div>
            <input type="range" id="s1" min="0" max="2" step="0.1" value="0" oninput="run()">
        </div>

        <div class="row">
            <div class="label-wrap"><label>3. HARF ARALIĞI</label><span id="v3">0</span></div>
            <input type="range" id="s3" min="0" max="20" value="0" oninput="run()">
        </div>
        
        <div style="font-size: 9px; color: #444; text-align: center;">Frankfurt Engine Active | v7.3</div>
    </div>

    <script>
        function run() {
            var thin = document.getElementById('s1').value;
            var sharp = document.getElementById('s2').value;
            var space = document.getElementById('s3').value;

            var el = document.getElementById('odak');

            // 1. İNCELTME: -webkit-text-stroke kullanarak harfin içini boşaltmadan zayıflatıyoruz
            // Bu, gözün oluşturduğu halenin birbirine girmesini engeller.
            el.style.webkitTextStroke = thin + "px black"; 
            el.style.letterSpacing = space + "px";

            // 2. KAYAÇ (DE-CONV): Matrisin kenarlarını negatif yaparak merkezi parlatıyoruz
            var edge = -(sharp / 20).toFixed(2);
            var center = (1 - (edge * 4)).toFixed(2);
            var matrix = `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`;
            document.getElementById('mx').setAttribute('kernelMatrix', matrix);

            // Değerleri Yaz
            document.getElementById('v1').innerText = thin;
            document.getElementById('v2').innerText = sharp;
            document.getElementById('v3').innerText = space;
        }
        window.onload = run;
    </script>
</body>
</html>

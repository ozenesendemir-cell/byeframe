<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByeFrame v7.4 - Micro Focus</title>
    <style>
        body { 
            margin: 0; background: black; color: white; 
            font-family: 'Segoe UI', sans-serif; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh;
        }
        
        #stage { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            padding: 30px;
        }
        
        /* MİKRO OKUMA ALANI: Yazı %35 küçültüldü (yaklaşık 15px) */
        #odak { 
            font-size: 15.6px; 
            font-weight: 500;
            line-height: 1.6;
            text-align: center;
            filter: url(#motor);
            max-width: 300px;
        }

        .controls { background: #0a0a0a; padding: 25px; border-top: 2px solid #333; }
        .row { margin-bottom: 18px; }
        .label-wrap { display: flex; justify-content: space-between; margin-bottom: 5px; }
        label { color: #007bff; font-size: 10px; font-weight: bold; }
        span { font-size: 10px; color: #777; }
        input { width: 100%; height: 35px; accent-color: #007bff; }
    </style>
</head>
<body>

    <div id="stage">
        <div id="odak">
            ByeFrame v7.4 Mikro Test:<br>
            Presbiopi (+2.5) için bu boyuttaki metni gözlüksüz okumak normalde imkansızdır. 
            Eğer "Kayaç" ve "İncelme" kombinasyonu doğruysa, harf kenarlarındaki sis tabakası kalkmalı ve karakterler tek tek seçilebilmelidir.
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="motor" color-interpolation-filters="sRGB">
            <feConvolveMatrix id="mx" order="3" preserveAlpha="true" kernelMatrix="0 0 0 0 1 0 0 0 0" />
        </filter>
    </svg>

    <div class="controls">
        <div class="row">
            <div class="label-wrap"><label>1. KESKİNLİK (DE-CONV)</label><span id="v2">0</span></div>
            <input type="range" id="s2" min="0" max="400" value="0" oninput="run()">
        </div>
        
        <div class="row">
            <div class="label-wrap"><label>2. ANTI-HALO (İNCELTME)</label><span id="v1">0</span></div>
            <input type="range" id="s1" min="0" max="1.5" step="0.1" value="0" oninput="run()">
        </div>

        <div class="row">
            <div class="label-wrap"><label>3. HARF ARALIĞI</label><span id="v3">0</span></div>
            <input type="range" id="s3" min="0" max="15" value="0" oninput="run()">
        </div>
    </div>

    <script>
        function run() {
            var thin = document.getElementById('s1').value;
            var sharp = document.getElementById('s2').value;
            var space = document.getElementById('s3').value;
            var el = document.getElementById('odak');

            // İncelme ve Aralık
            el.style.webkitTextStroke = thin + "px black"; 
            el.style.letterSpacing = space + "px";

            // Kayaç Motoru (De-convolution)
            var edge = -(sharp / 20).toFixed(2);
            var center = (1 - (edge * 4)).toFixed(2);
            var matrix = `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`;
            document.getElementById('mx').setAttribute('kernelMatrix', matrix);

            // UI Güncelle
            document.getElementById('v1').innerText = thin;
            document.getElementById('v2').innerText = sharp;
            document.getElementById('v3').innerText = space;
        }
        window.onload = run;
    </script>
</body>
</html>

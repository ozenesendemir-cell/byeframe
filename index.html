<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByeFrame v8.0 - Compact Precision</title>
    <style>
        body { 
            margin: 0; background: black; color: white; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            overflow: hidden; display: flex; flex-direction: column; height: 100vh;
        }

        /* Üst Panel: Görsel ve Metin */
        #display-stage { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            padding: 10px; overflow: hidden;
        }

        #viewport { filter: url(#byeEngine); text-align: center; }

        .test-img { width: 100%; max-width: 260px; height: auto; border-radius: 6px; margin: 10px 0; }
        
        #odak { font-size: 13px; font-weight: 700; line-height: 1.4; margin-bottom: 5px; }

        /* Alt Panel: Kontroller (Ekrana Sabit) */
        .controls { 
            background: #111; padding: 15px 20px; 
            border-top: 2px solid #333; box-sizing: border-box;
            padding-bottom: env(safe-area-inset-bottom); /* iPhone çentiği için */
        }

        .row { margin-bottom: 12px; }
        .l-wrap { display: flex; justify-content: space-between; margin-bottom: 4px; }
        label { color: #007bff; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        span { font-size: 10px; color: #fff; background: #222; padding: 1px 4px; border-radius: 3px; }
        
        input[type=range] { 
            width: 100%; height: 30px; margin: 0;
            accent-color: #007bff; -webkit-appearance: none; background: transparent;
        }
        input[type=range]::-webkit-slider-runnable-track { background: #333; height: 4px; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; background: #007bff; border-radius: 50%; margin-top: -7px; }
    </style>
</head>
<body>

    <div id="display-stage">
        <div id="viewport">
            <div id="odak">
                v8.0 COMPACT TEST<br>
                <small>Anti-Halo: 0.7 | Keskinlik: 175</small>
            </div>
            
            <img src="https://images.unsplash.com/photo-1509048191080-d2984bad6ae5?auto=format&fit=crop&w=400&q=80" class="test-img">
            
            <p style="font-size: 10px; color: #888;">Dişlilerin keskinliğini kontrol et.</p>
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="byeEngine" color-interpolation-filters="sRGB">
            <feConvolveMatrix id="mx" order="3" preserveAlpha="true" kernelMatrix="0 0 0 0 1 0 0 0 0" />
            <feComponentTransfer id="ct">
                <feFuncR type="linear" slope="3" intercept="-0.2"/>
                <feFuncG type="linear" slope="3" intercept="-0.2"/>
                <feFuncB type="linear" slope="3" intercept="-0.2"/>
            </feComponentTransfer>
        </filter>
    </svg>

    <div class="controls">
        <div class="row">
            <div class="l-wrap"><label>KESKİNLİK (175)</label><span id="v1">175</span></div>
            <input type="range" id="s1" min="0" max="400" value="175" oninput="up()">
        </div>
        <div class="row">
            <div class="l-wrap"><label>KONTRAST (3.0)</label><span id="v2">3</span></div>
            <input type="range" id="s2" min="1" max="5" step="0.1" value="3" oninput="up()">
        </div>
        <div class="row">
            <div class="l-wrap"><label>ANTI-HALO (0.7)</label><span id="v3">0.7</span></div>
            <input type="range" id="s3" min="0" max="1.5" step="0.05" value="0.7" oninput="up()">
        </div>
    </div>

    <script>
        function up() {
            var s = document.getElementById('s1').value;
            var c = document.getElementById('s2').value;
            var h = document.getElementById('s3').value;

            // Keskinlik Motoru
            var edge = -(s / 25).toFixed(2);
            var center = (1 - (edge * 4)).toFixed(2);
            document.getElementById('mx').setAttribute('kernelMatrix', `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`);

            // Kontrast Motoru
            var funcs = document.querySelectorAll('#ct feFuncR, #ct feFuncG, #ct feFuncB');
            funcs.forEach(f => {
                f.setAttribute('slope', c);
                f.setAttribute('intercept', -(c/10));
            });

            // Metin Motoru
            document.getElementById('odak').style.webkitTextStroke = h + "px black";

            // UI Yazıları
            document.getElementById('v1').innerText = s;
            document.getElementById('v2').innerText = c;
            document.getElementById('v3').innerText = h;
        }
        window.onload = up;
    </script>
</body>
</html>

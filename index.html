<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>ByeFrame · Optik Laboratuvar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-bar">
    <div class="logo-section">
      <span class="logo-icon">👁️</span>
      <span class="logo-text">ByeFrame</span>
      <span class="badge">PRO LAB</span>
    </div>
    <div class="top-controls">
      <select id="profileSelect" class="profile-dropdown"></select>
      <button id="panicResetBtn" class="panic-button">⟳ RESET</button>
    </div>
  </div>

  <main class="focal-area">
    <div class="focal-container">
      <div class="test-character" id="testCharacter">8</div>
      <div class="test-label">ODAK NOKTASI</div>
    </div>
    <div class="sample-text-container">
      <p class="sample-text" id="sampleText">Hızlı kahverengi tilki tembel köpeğin üzerinden atlar. +2.5 test: Net görene kadar ayarla.</p>
    </div>
  </main>

  <div class="control-dock">
    <div class="control-dock-inner">
      <div class="live-values-bar">
        <span>🔍 <span id="scaleValLive">100</span>%</span>
        <span>✒️ <span id="weightValLive">400</span></span>
        <span>⚡ <span id="sharpValLive">0</span></span>
      </div>
      <div class="sliders-grid">
        <div class="slider-card">
          <label>🔍 BÜYÜTME (Zoom) <span id="scaleVal">100</span>%</label>
          <input type="range" id="scaleSlider" min="100" max="250" step="5" value="100" class="thumb-slider">
        </div>
        <div class="slider-card">
          <label>✒️ KALINLIK <span id="fontWeightVal">400</span></label>
          <input type="range" id="fontWeightSlider" min="100" max="900" step="50" value="400" class="thumb-slider">
        </div>
        <div class="slider-card">
          <label>🔆 KONTRAST <span id="contrastVal">100</span>%</label>
          <input type="range" id="contrastSlider" min="50" max="200" step="1" value="100" class="thumb-slider">
        </div>
        <div class="slider-card">
          <label>⚡ KESKİNLİK <span id="sharpVal">0</span></label>
          <input type="range" id="sharpSlider" min="0" max="200" step="5" value="0" class="thumb-slider">
        </div>
        <div class="slider-card">
          <label>🌈 RENK KAYMASI <span id="chromaVal">0</span>px</label>
          <input type="range" id="chromaSlider" min="0" max="10" step="0.2" value="0" class="thumb-slider">
        </div>
        <div class="slider-card">
          <label>💡 PARLAKLIK <span id="brightVal">100</span>%</label>
          <input type="range" id="brightSlider" min="60" max="160" step="1" value="100" class="thumb-slider">
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>

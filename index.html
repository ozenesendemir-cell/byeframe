<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByeFrame v7.9 - Real World Test</title>
    <style>
        body { 
            margin: 0; background: black; color: white; 
            font-family: sans-serif; overflow: hidden;
            display: flex; flex-direction: column; height: 100vh;
        }
        #stage { flex: 1; overflow-y: auto; padding: 20px; text-align: center; }
        
        /* TÜM EKRAN FİLTRESİ */
        #viewport { filter: url(#byeEngine); }

        .test-img { width: 100%; max-width: 280px; border-radius: 8px; margin: 15px 0; border: 1px solid #333; }
        
        #odak { font-size: 13px; font-weight: 700; line-height: 1.6; }

        .controls { background: #080808; padding: 20px; border-top: 1px solid #333; }
        .row { margin-bottom: 12px; }
        .l-wrap { display: flex; justify-content: space-between; margin-bottom: 4px; }
        label { color: #007bff; font-size: 10px; font-weight: bold; }
        span { font-size: 10px; color: #fff; background: #222; padding: 2px 5px; border-radius: 3px; }
        input { width: 100%; height: 30px; accent-color: #007bff; }
    </style>
</head>
<body>

    <div id="stage">
        <div id="viewport">
            <div id="odak">
                v7.9 GERÇEK DÜNYA TESTİ<br>
                <small>Anti-Halo: 0.7 | Keskinlik: 175</small>
            </div>
            
            <img src="https://images.unsplash.com/photo-1509048191080-d2984bad6ae5?auto=format&fit=crop&w=400&q=80" class="test-img">
            
            <p style="font-size: 11px; color: #aaa;">
                Saatin içindeki rakamları ve ince çark dişlilerini görebiliyor musun?
            </p>
        </div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="byeEngine" color-interpolation-filters="sRGB">
            <feConvolveMatrix id="mx" order="3" preserveAlpha="true" kernelMatrix="0 0 0 0 1 0 0 0 0" />
            <feComponentTransfer id="ct">
                <feFuncR type="linear" slope="3" intercept="-0.2"/>
                <feFuncG type="linear" slope="3" intercept="-0.2"/>
                <feFuncB type="linear" slope="3" intercept="-0.2"/>
            </feComponentTransfer>
        </filter>
    </svg>

    <div class="controls">
        <div class="row">
            <div class="l-wrap"><label>KESKİNLİK (DE-CONV)</label><span id="v1">175</span></div>
            <input type="range" id="s1" min="0" max="400" value="175" oninput="up()">
        </div>
        <div class="row">
            <div class="l-wrap"><label>KONTRAST GÜCÜ</label><span id="v2">3</span></div>
            <input type="range" id="s2" min="1" max="5" step="0.1" value="3" oninput="up()">
        </div>
        <div class="row">
            <div class="l-wrap"><label>METİN ANTI-HALO</label><span id="v3">0.7</span></div>
            <input type="range" id="s3" min="0" max="1.5" step="0.05" value="0.7" oninput="up()">
        </div>
    </div>

    <script>
        function up() {
            var s = document.getElementById('s1').value;
            var c = document.getElementById('s2').value;
            var h = document.getElementById('s3').value;

            // Matris (175 bandı)
            var edge = -(s / 25).toFixed(2);
            var center = (1 - (edge * 4)).toFixed(2);
            document.getElementById('mx').setAttribute('kernelMatrix', `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`);

            // Kontrast (Slope)
            var funcs = document.querySelectorAll('#ct feFuncR, #ct feFuncG, #ct feFuncB');
            funcs.forEach(f => {
                f.setAttribute('slope', c);
                f.setAttribute('intercept', -(c/10)); // Parlaklık dengeleme
            });

            // Metin Anti-Halo
            document.getElementById('odak').style.webkitTextStroke = h + "px black";

            document.getElementById('v1').innerText = s;
            document.getElementById('v2').innerText = c;
            document.getElementById('v3').innerText = h;
        }
        window.onload = up;
    </script>
</body>
</html>

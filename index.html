<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ByeFrame v6.1 · Inverse Distortion Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-bar">
    <div class="logo-section"><span>👁️ ByeFrame</span> <span class="badge">V6.1 ENGINE</span></div>
    <div class="top-controls">
      <select id="profileSelect" class="profile-dropdown"></select>
      <button id="panicResetBtn" class="panic-button">⟳ RESET</button>
    </div>
  </div>

  <main class="focal-area">
    <div class="visualizer-container">
      <canvas id="distortionCanvas" width="120" height="120"></canvas>
      <div class="test-label">DISTORTION MAP</div>
    </div>

    <div id="testCharacter" class="engine-target">8</div>
    
    <div class="sample-text-container">
      <p id="sampleText" class="engine-target">Ters çarpıtma motoru aktif. De-convolution sürgüsü ile gözünüzün oluşturduğu 'sis' tabakasını kırmayı deneyin.</p>
    </div>
  </main>

  <div class="control-dock">
    <div class="condition-tabs">
      <button class="condition-btn active" data-condition="myopia">Miyop</button>
      <button class="condition-btn" data-condition="hyperopia">Hipermetrop</button>
      <button class="condition-btn" data-condition="astigmatism">Astigmat</button>
      <button class="condition-btn" data-condition="presbyopia">Presbiyopi</button>
    </div>

    <div class="sliders-grid">
      <div class="slider-card highlight">
        <label>🌀 TERS KESKİNLİK (De-conv) <span id="deconvVal">0</span></label>
        <input type="range" id="deconvSlider" min="0" max="200" step="1" value="0" class="thumb-slider">
      </div>
      <div class="slider-card">
        <label>🔍 BÜYÜTME <span id="scaleVal">100</span>%</label>
        <input type="range" id="scaleSlider" min="100" max="250" step="5" value="100" class="thumb-slider">
      </div>
      <div class="slider-card">
        <label>📏 RADYAL ÇARPITMA <span id="radialVal">0</span></label>
        <input type="range" id="radialSlider" min="-100" max="100" step="1" value="0" class="thumb-slider">
      </div>
      <div class="slider-card">
        <label>✏️ KENAR HATTI <span id="textStrokeVal">0</span>px</label>
        <input type="range" id="textStrokeSlider" min="0" max="3" step="0.1" value="0" class="thumb-slider">
      </div>
      <div class="slider-card">
        <label>📐 ASTİGMAT AKSI <span id="axisVal">0</span>°</label>
        <input type="range" id="axisSlider" min="0" max="180" step="1" value="0" class="thumb-slider">
      </div>
      <div class="slider-card">
        <label>🔆 KONTRAST <span id="contrastVal">100</span>%</label>
        <input type="range" id="contrastSlider" min="100" max="250" step="1" value="100" class="thumb-slider">
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>ByeFrame v5 · Pixel Shimmer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-bar">
    <div class="logo-section">
      <span class="logo-icon">👁️</span>
      <span class="logo-text">ByeFrame</span>
      <span class="badge">SHIMMER v5</span>
    </div>
    <div class="top-controls">
      <select id="profileSelect" class="profile-dropdown"></select>
      <button id="panicResetBtn" class="panic-button">⟳ RESET</button>
    </div>
  </div>

  <main class="focal-area">
    <div class="focal-container">
      <div class="test-character shimmer-target" id="testCharacter">8</div>
      <div class="test-label">ODAK NOKTASI</div>
    </div>
    <div class="sample-text-container">
      <p class="sample-text shimmer-target" id="sampleText">Titreşim frekansını (Hz) ayarlayarak harflerin kenarlarını yakalamaya çalışın.</p>
    </div>
  </main>

  <div class="control-dock">
    <div class="control-dock-inner">
      <div class="live-values-bar">
        <span>🔍 <span id="scaleValLive">100</span>%</span>
        <span>✒️ <span id="weightValLive">400</span></span>
        <span>✨ <span id="shimmerFreqLive">0</span>Hz</span>
      </div>
      
      <div class="sliders-grid">
        <div class="slider-card shimmer-card">
          <label>✨ TİTREŞİM FREKANSI (Hz) <span id="shimmerFreqVal">0</span></label>
          <input type="range" id="shimmerFreqSlider" min="0" max="60" step="1" value="0" class="thumb-slider">
          <button id="shimmerToggleBtn" class="shimmer-toggle">✨ TİTREŞİMİ AÇ</button>
        </div>
        <div class="slider-card">
          <label>🔍 BÜYÜTME <span id="scaleVal">100</span>%</label>
          <input type="range" id="scaleSlider" min="100" max="250" step="5" value="100" class="thumb-slider">
        </div>
        <div class="slider-card">
          <label>✒️ KALINLIK <span id="fontWeightVal">400</span></label>
          <input type="range" id="fontWeightSlider" min="100" max="900" step="50" value="400" class="thumb-slider">
        </div>
        <div class="slider-card">
          <label>📏 HARF ARALIĞI <span id="letterSpacingVal">0</span>px</label>
          <input type="range" id="letterSpacingSlider" min="0" max="30" step="1" value="0" class="thumb-slider">
        </div>
        <div class="slider-card">
          <label>✏️ KENAR ÇİZGİSİ <span id="textStrokeVal">0</span>px</label>
          <input type="range" id="textStrokeSlider" min="0" max="3" step="0.1" value="0" class="thumb-slider">
        </div>
        <div class="slider-card">
          <label>🔆 KONTRAST <span id="contrastVal">100</span>%</label>
          <input type="range" id="contrastSlider" min="50" max="200" step="1" value="100" class="thumb-slider">
        </div>
      </div>

      <div class="color-mode-section">
        <div class="color-buttons">
          <button data-color="default" class="color-btn active">🌙 Default</button>
          <button data-color="amber" class="color-btn">🟠 Amber</button>
          <button data-color="cyan" class="color-btn">🔵 Cyan</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>

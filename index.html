<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByeFrame v7.0</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; text-align: center; }
        #view { height: 60vh; display: flex; align-items: center; justify-content: center; }
        #target { font-size: 80px; font-weight: bold; transition: none; }
        .controls { height: 40vh; background: #111; padding: 20px; border-top: 1px solid #333; box-sizing: border-box; }
        .row { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; color: #007bff; font-size: 14px; }
        input { width: 100%; height: 40px; }
    </style>
</head>
<body>
    <div id="view">
        <div id="target" style="filter: url(#optikMotor);">8</div>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="optikMotor">
            <feConvolveMatrix id="matrix" order="3" preserveAlpha="true" kernelMatrix="0 0 0 0 1 0 0 0 0" />
        </filter>
    </svg>

    <div class="controls">
        <div class="row">
            <label>BÜYÜTME: <span id="val-zoom">80</span>px</label>
            <input type="range" id="slider-zoom" min="20" max="400" value="80">
        </div>
        <div class="row">
            <label>KESKİNLİK (DE-CONV): <span id="val-sharp">0</span></label>
            <input type="range" id="slider-sharp" min="0" max="100" value="0">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ByeFrame v7.6 - Pure Focus</title>
    <style>
        body { 
            margin: 0; background: black; color: white; 
            font-family: 'Arial', sans-serif; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh;
        }
        
        #stage { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            padding: 20px;
        }
        
        /* MİKRO ODAK ALANI */
        #odak { 
            font-size: 11px; 
            font-weight: 700; /* Daha kalın font, inceltme için alan sağlar */
            line-height: 1.8;
            text-align: center;
            max-width: 260px;
            color: #ffffff;
            /* Donanım hızlandırmalı keskinleştirme simülasyonu */
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: none; 
        }

        .controls { background: #0a0a0a; padding: 20px; border-top: 1px solid #333; }
        .row { margin-bottom: 15px; }
        .label-wrap { display: flex; justify-content: space-between; margin-bottom: 5px; }
        label { color: #007bff; font-size: 10px; font-weight: bold; }
        span { font-size: 10px; color: #777; }
        input { width: 100%; height: 35px; accent-color: #007bff; }
    </style>
</head>
<body>

    <div id="stage">
        <div id="odak">
            ByeFrame v7.6 Pure Focus:<br>
            Anti-Halo 0.7 seviyesinde harfin "kemik" yapısını korur. 
            Eğer keskinlik hala işlevsizse, kontrastı donanım seviyesinde zorluyoruz. 
            Harf aralığı 2px, gözün karakterleri birbirinden ayırması için kritik eşiktir.
        </div>
    </div>

    <div class="controls">
        <div class="row">
            <div class="label-wrap"><label>1. SİYAH DERİNLİK (KONTRAST)</label><span id="v2">100</span></div>
            <input type="range" id="s2" min="100" max="300" value="100" oninput="run()">
        </div>
        
        <div class="row">
            <div class="label-wrap"><label>2. ANTI-HALO (İNCELTME)</label><span id="v1">0.7</span></div>
            <input type="range" id="s1" min="0" max="1.5" step="0.05" value="0.7" oninput="run()">
        </div>

        <div class="row">
            <div class="label-wrap"><label>3. HARF ARALIĞI</label><span id="v3">2</span></div>
            <input type="range" id="s3" min="0" max="10" value="2" oninput="run()">
        </div>
    </div>

    <script>
        function run() {
            var contrast = document.getElementById('s2').value;
            var thin = document.getElementById('s1').value;
            var space = document.getElementById('s3').value;
            var el = document.getElementById('odak');

            // 1. Kontrast ve Parlaklık (Filter kullanarak)
            el.style.filter = `contrast(${contrast}%) brightness(1.1)`;

            // 2. Anti-Halo (Stroke)
            el.style.webkitTextStroke = thin + "px black"; 

            // 3. Aralığı Uygula
            el.style.letterSpacing = space + "px";

            // Değerleri Yaz
            document.getElementById('v1').innerText = thin;
            document.getElementById('v2').innerText = contrast;
            document.getElementById('v3').innerText = space;
        }
        window.onload = run;
    </script>
</body>
</html>

<div class="controls">
    <div class="row">
        <div class="l-wrap"><label>GÜNEŞ GÜCÜ (KESKİNLİK)</label><span id="v1">0</span></div>
        <input type="range" id="s1" min="0" max="600" value="0" oninput="up()">
    </div>
    <div class="row">
        <div class="l-wrap"><label>X-RAY KONTRAST</label><span id="v2">1.0</span></div>
        <input type="range" id="s2" min="1" max="8" step="0.2" value="1.0" oninput="up()">
    </div>
    <div class="row">
        <div class="l-wrap"><label>ANTI-HALO</label><span id="v3">0.00</span></div>
        <input type="range" id="s3" min="0" max="1.0" step="0.02" value="0" oninput="up()">
    </div>
</div>

<script>
    function up() {
        var s = document.getElementById('s1').value;
        var c = document.getElementById('s2').value;
        var h = document.getElementById('s3').value;

        // Daha agresif keskinleştirme matrisi
        var edge = -(s / 20).toFixed(3);
        var center = (1 - (edge * 4)).toFixed(3);
        document.getElementById('mx').setAttribute('kernelMatrix', `0 ${edge} 0 ${edge} ${center} ${edge} 0 ${edge} 0`);

        // Daha derin kontrast (Slope artarken intercept düşürülerek siyahlar korunur)
        var funcs = document.querySelectorAll('#ct feFuncR, #ct feFuncG, #ct feFuncB');
        funcs.forEach(f => {
            f.setAttribute('slope', c);
            f.setAttribute('intercept', -(c - 1) * 0.1); 
        });

        document.getElementById('text-test').style.webkitTextStroke = h + "px black";
        document.getElementById('v1').innerText = s;
        document.getElementById('v2').innerText = c;
        document.getElementById('v3').innerText = h;
    }
</script>
